{% load static %}
<header class="topbar shadow-sm">
  <button class="btn btn-light btn-sm d-md-none me-2" id="sidebarToggle" type="button" aria-label="Toggle sidebar">
    <i class="bi bi-list"></i>
  </button>

  <form class="topbar-search" role="search" action="{% url 'inventory:product_list' %}" method="get">
    <div class="input-group">
      <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
      <input
        type="search"
        class="form-control border-start-0"
        name="q"
        id="globalSearch"
        placeholder="Search medicines, customers, invoices…"
        autocomplete="off"
        value="{{ request.GET.q|default:'' }}"
      />
    </div>
    <div class="search-suggestions" id="globalSuggestions" hidden></div>
  </form>

  <div class="topbar-actions">
    <a href="{% url 'sales:order' %}" class="btn btn-primary btn-sm topbar-cta">
      <i class="bi bi-plus-lg"></i><span class="d-none d-md-inline ms-1">New Order</span>
    </a>
    <a href="{% url 'inventory:reminders' %}" class="btn btn-light btn-sm position-relative" title="Reminders">
      <i class="bi bi-bell"></i>
    </a>
    <div class="dropdown">
      <button class="btn btn-light btn-sm d-flex align-items-center gap-2" data-bs-toggle="dropdown" aria-expanded="false">
        <span class="avatar-circle">{{ user.username|first|upper }}</span>
        <span class="d-none d-md-inline small">{{ user.get_full_name|default:user.username }}</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li class="px-3 py-2 small text-muted">
          Signed in as<br />
          <strong>{{ user.username }}</strong>
        </li>
        <li><hr class="dropdown-divider" /></li>
        <li><a class="dropdown-item" href="{% url 'accounts:settings' %}"><i class="bi bi-gear me-2"></i>Settings</a></li>
        <li>
          <form action="{% url 'accounts:logout' %}" method="post" class="px-2">
            {% csrf_token %}
            <button type="submit" class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Sign out</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</header>

<div class="modal fade" id="quickProductModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content soft-modal">
      <div class="modal-header border-0">
        <div>
          <h5 class="modal-title" id="quickProductName">Add medicine</h5>
          <p class="text-muted mb-0 small" id="quickProductMeta"></p>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex gap-3 align-items-start">
          <div class="medicine-preview" id="quickProductImage"><i class="bi bi-capsule-pill"></i></div>
          <div class="flex-grow-1">
            <input type="hidden" id="quickBatchId">
            <input type="hidden" id="quickPriceType" value="tp">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label">Strength</label>
                <div class="variant-pills" id="quickStrengthOptions"></div>
              </div>
              <div class="col-12">
                <label class="form-label">Available stock by batch</label>
                <select class="form-select" id="quickBatchSelect"></select>
              </div>
              <div class="col-6">
                <label class="form-label">Quantity</label>
                <input type="number" class="form-control" id="quickQuantity" min="1" value="1">
              </div>
              <div class="col-6">
                <label class="form-label">Price type</label>
                <div class="btn-group w-100" role="group" aria-label="Price type">
                  <button type="button" class="btn btn-primary" data-price-type="tp">TP</button>
                  <button type="button" class="btn btn-outline-primary" data-price-type="mrp">MRP</button>
                </div>
              </div>
              <div class="col-12">
                <label class="form-label">Selected price</label>
                <button type="button" class="btn btn-light w-100 text-start" id="quickUnitPrice" disabled>0.00</button>
              </div>
              <div class="col-6">
                <label class="form-label">Discount %</label>
                <input type="number" class="form-control" id="quickDiscountPercent" min="0" max="100" step="0.01" value="0">
              </div>
              <div class="col-6">
                <label class="form-label">Add %</label>
                <input type="number" class="form-control" id="quickAddPercent" min="0" max="100" step="0.01" value="0">
              </div>
            </div>
            <div class="small text-muted mt-3" id="quickStockInfo"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" id="quickSaveProduct">Save to cart</button>
      </div>
    </div>
  </div>
</div>

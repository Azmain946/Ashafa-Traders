<aside class="app-sidebar">
  <a class="brand" href="{% url 'home' %}">
    <span class="brand-icon"><i class="bi bi-capsule-pill"></i></span>
    <span>
      <strong>Ashafa ERP</strong>
      <small>Pharmacy operations</small>
    </span>
  </a>
  <nav class="sidebar-nav">
    <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}"><i class="bi bi-house"></i> Home</a>
    <a href="{% url 'order' %}" class="{% if request.resolver_match.url_name == 'order' %}active{% endif %}"><i class="bi bi-cart-plus"></i> Order</a>
    <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="{% url 'products' %}" class="{% if 'product' in request.resolver_match.url_name %}active{% endif %}"><i class="bi bi-box-seam"></i> Products & Stock</a>
    <a href="{% url 'customers' %}" class="{% if 'customer' in request.resolver_match.url_name %}active{% endif %}"><i class="bi bi-people"></i> Customers</a>

      <a href="{% url 'settings' %}" class="{% if request.resolver_match.url_name == 'settings' %}active{% endif %}"><i class="bi bi-gear"></i> Settings</a>
    {% endif %}
  </nav>
</aside>

{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Ashafa Pharmacy ERP</title>
  <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="login-body">
  <main class="login-card shadow-lg">
    <div class="brand justify-content-center mb-4">
      <span class="brand-icon"><i class="bi bi-capsule-pill"></i></span>
      <span>
        <strong>Ashafa ERP</strong>
        <small>Pharmacy operations</small>
      </span>
    </div>
    <h1 class="h4 text-center mb-1">Welcome back</h1>
    <p class="text-center text-muted mb-4">Sign in to manage sales, stock, and reminders.</p>
    {% if form.errors %}
      <div class="alert alert-danger">Invalid username or password.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
        <input type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" class="form-control form-control-lg" autofocus required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
        <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}" class="form-control form-control-lg" required>
      </div>
      <button class="btn btn-primary btn-lg w-100">Sign in</button>
    </form>
  </main>
</body>
</html>
